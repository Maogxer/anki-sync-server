name: 🚨 Anki Official Files Monitor

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  check_for_changes:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write 
      issues: write
      actions: write

    steps:
      - name: Checkout THIS repository
        uses: actions/checkout@v4
        
      - name: Clone Anki Official Repository
        uses: actions/checkout@v4
        with:
          repository: ankitects/anki
          path: anki-official
          fetch-depth: 0

      - name: Check for Changes and Get Current SHA & Tag
        id: diff_check
        run: |
          FILE_PATH_DOCKER="docs/syncserver/Dockerfile"
          FILE_PATH_ENTRYPOINT="docs/syncserver/entrypoint.sh"
          
          CURRENT_SHA=$(git -C anki-official rev-parse HEAD)
          echo "CURRENT_SHA=$CURRENT_SHA" >> $GITHUB_OUTPUT
          
          LAST_SHA=""
          if [ -f last_anki_sha.txt ]; then
              LAST_SHA=$(cat last_anki_sha.txt)
          fi
          echo "LAST_SHA=$LAST_SHA" >> $GITHUB_OUTPUT

          # 🌟 强行使用 API 抓取官方最权威的 "Latest" 稳定版标签
          CURRENT_TAG=$(curl -s https://github.com | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          
          if [ -z "$CURRENT_TAG" ]; then
              echo "API 获取失败，降级使用 Git 本地 Tag..."
              CURRENT_TAG=$(git -C anki-official describe --tags --abbrev=0)
          fi
          echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_OUTPUT

          LAST_TAG=""
          if [ -f last_anki_tag.txt ]; then
              LAST_TAG=$(cat last_anki_tag.txt)
          fi
          
          SHA_CHANGED="false"
          if [ -z "$LAST_SHA" ] || [ "$LAST_SHA" != "$CURRENT_SHA" ]; then
              SHA_CHANGED="true"
          fi

          TAG_CHANGED="false"
          if [ -z "$LAST_TAG" ] || [ "$LAST_TAG" != "$CURRENT_TAG" ]; then
              TAG_CHANGED="true"
          fi
          
          echo "TAG_CHANGED=$TAG_CHANGED" >> $GITHUB_OUTPUT
          
          # 安全的多行写入语法
          echo "NOTIFICATION_BODY<<EOF" >> $GITHUB_OUTPUT
          
          NOTIFY="false"
          
          if [ "$TAG_CHANGED" = "true" ]; then
              echo "- [版本变动] 发现新稳定版本 Tag: ${CURRENT_TAG}。" >> $GITHUB_OUTPUT
              NOTIFY="true"
          fi
          
          if [ "$TAG_CHANGED" = "false" ] && [ "$SHA_CHANGED" = "true" ] && [ -n "$LAST_SHA" ]; then
              DIFF_DOCKER=$(git -C anki-official diff $LAST_SHA $CURRENT_SHA -- $FILE_PATH_DOCKER)
              DIFF_ENTRYPOINT=$(git -C anki-official diff $LAST_SHA $CURRENT_SHA -- $FILE_PATH_ENTRYPOINT)

              if [ -n "$DIFF_DOCKER" ]; then
                  echo "- [Dockerfile] 发生内容变动。" >> $GITHUB_OUTPUT
                  NOTIFY="true"
              fi
              if [ -n "$DIFF_ENTRYPOINT" ]; then
                  echo "- [entrypoint.sh] 发生内容变动。" >> $GITHUB_OUTPUT
                  NOTIFY="true"
              fi
          fi
          
          if [ ! -f "anki-official/$FILE_PATH_DOCKER" ] || [ ! -f "anki-official/$FILE_PATH_ENTRYPOINT" ]; then
              echo "- [结构变动] 关键文件缺失或目录已移动。" >> $GITHUB_OUTPUT
              NOTIFY="true"
          fi

          echo "EOF" >> $GITHUB_OUTPUT
          echo "NOTIFY=$NOTIFY" >> $GITHUB_OUTPUT

      - name: Create Issue Notification
        if: steps.diff_check.outputs.NOTIFY == 'true'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const notificationBody = `${{ steps.diff_check.outputs.NOTIFICATION_BODY }}`;
            const currentSha = "${{ steps.diff_check.outputs.CURRENT_SHA }}";
            const currentTag = "${{ steps.diff_check.outputs.CURRENT_TAG }}";
            const lastSha = "${{ steps.diff_check.outputs.LAST_SHA }}";
            const repoOwner = context.repo.owner;
            
            let issueTitle = '🚨 Anki 官方配置变动：';
            if ("${{ steps.diff_check.outputs.TAG_CHANGED }}" === 'true') {
                issueTitle = `🚀 Anki 官方发布新版本：${currentTag}，已自动触发构建`;
            } else {
                issueTitle += 'Dockerfile/Entrypoint 内容已更新';
            }
            
            const issueBody = `
            @${repoOwner}，您的 Anki 同步服务器构建依赖的官方配置已发生变动。请检查是否需要更新 \`build-and-push.yml\` 中的依赖项。

            **变动摘要：**
            ${notificationBody}

            **Git Diff 链接 (本次变动):**
            https://github.com{lastSha || 'main'}..${currentSha}

            本次检查的 Anki Commit SHA: \`${currentSha}\`
            `;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody
            });

      - name: Trigger Build Workflow
        if: steps.diff_check.outputs.TAG_CHANGED == 'true'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const newTag = "${{ steps.diff_check.outputs.CURRENT_TAG }}";
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-and-push.yml', 
              ref: context.ref, 
              inputs: {
                tag: newTag
              }
            });

      - name: Update Last Known SHA
        run: |
          echo "${{ steps.diff_check.outputs.CURRENT_SHA }}" > last_anki_sha.txt
      
      - name: Update Last Known Tag
        run: |
          echo "${{ steps.diff_check.outputs.CURRENT_TAG }}" > last_anki_tag.txt
          
      - name: Commit SHA and Tag Update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'CI: Force update Anki tracker logic'
          file_pattern: 'last_anki_sha.txt last_anki_tag.txt'
